          subtitle: "Hi there! I'm Suraj Kumar, a Ph.D. student in Economics at Boston College advised by Pablo Guerrón-Quintana. My research is in macroeconomics, international finance, and time-series econometrics, including foundation models for macroeconomic forecasting. Before the Ph.D., I worked as a Research Associate at CAFRAL, Reserve Bank of India, an Economics Research Analyst at Goldman Sachs, and in analytics roles at American Express and Credit Suisse."
